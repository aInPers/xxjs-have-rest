<svg xmlns="http://www.w3.org/2000/svg"
     width="58"
     height="58"
     viewBox="0 0 58 58">

  <!-- 分支连接线 -->
  <g
    fill="none"
    stroke="#3367D6"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round">

    <path d="M18 15.5 V43.5"/>

    <path d="
      M18 43
      C18 35
      20 30
      30 30
      C39 30
      43 30
      43 15
    "/>

  </g>

  <!-- 三个节点 -->
  <g fill="#3367D6">
    <circle cx="18" cy="15.5" r="7.5"/>
    <circle cx="18" cy="43" r="7.5"/>
    <circle cx="43" cy="15.5" r="7.5"/>
  </g>

  <!-- 节点中心白点 -->
  <g fill="white">
    <circle cx="18" cy="15.5" r="1.8"/>
    <circle cx="18" cy="43" r="1.8"/>
    <circle cx="43" cy="15.5" r="1.8"/>
  </g>

</svg>